name: Apply Promotion IAM

on:
  pull_request:
    paths:
      - "terraform/platform/promotion-iam/**"
      - ".github/workflows/promotion-iam.yml"
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Confirm that the reviewed Promotion IAM plan should be applied"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: promotion-iam
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform/platform/promotion-iam
  TF_IN_AUTOMATION: true
  GCP_PROJECT_ID: imposing-fx-413205
  WIF_PROVIDER: projects/915035381641/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  PROMOTION_IAM_SERVICE_ACCOUNT: paved-road-promotion-iam@imposing-fx-413205.iam.gserviceaccount.com

jobs:
  plan:
    name: Plan Promotion IAM
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_apply == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PROMOTION_IAM_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir="${TF_WORKING_DIR}" fmt -check

      - name: Initialize Terraform
        run: terraform -chdir="${TF_WORKING_DIR}" init -reconfigure

      - name: Select default workspace
        run: terraform -chdir="${TF_WORKING_DIR}" workspace select default

      - name: Validate Terraform configuration
        run: terraform -chdir="${TF_WORKING_DIR}" validate

      - name: Create saved Terraform plan
        run: |
          terraform -chdir="${TF_WORKING_DIR}" plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      - name: Display human-readable plan
        run: |
          terraform -chdir="${TF_WORKING_DIR}" show \
            -no-color \
            tfplan |
          tee "${TF_WORKING_DIR}/tfplan.txt"

      - name: Hash saved plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: sha256sum tfplan | tee tfplan.sha256

      - name: Upload exact Terraform plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promotion-iam-tfplan-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.sha256
            ${{ env.TF_WORKING_DIR }}/tfplan.txt
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply Promotion IAM
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: platform-approval

    steps:
      - name: Checkout planned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PROMOTION_IAM_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform -chdir="${TF_WORKING_DIR}" init -reconfigure

      - name: Select default workspace
        run: terraform -chdir="${TF_WORKING_DIR}" workspace select default

      - name: Download reviewed Terraform plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: promotion-iam-tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Verify saved-plan integrity
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: sha256sum --check tfplan.sha256

      - name: Apply exact reviewed plan
        run: |
          terraform -chdir="${TF_WORKING_DIR}" apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            tfplan

      - name: Verify Terraform convergence
        run: |
          terraform -chdir="${TF_WORKING_DIR}" plan \
            -input=false \
            -lock-timeout=5m \
            -detailed-exitcode
