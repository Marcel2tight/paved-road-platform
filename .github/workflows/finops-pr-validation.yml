name: FinOps PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/finops-budget-consumer/**"
      - "terraform/platform/finops/**"
      - ".github/workflows/build-finops-budget-consumer-image.yml"
      - ".github/workflows/finops-pr-validation.yml"

permissions:
  contents: read

jobs:
  test-consumer:
    name: Test FinOps Budget Consumer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            -r services/finops-budget-consumer/requirements-dev.txt
          python -m pip check

      - name: Run consumer test suite
        run: |
          python -m pytest \
            -q \
            services/finops-budget-consumer

  validate-finops-terraform:
    name: Validate FinOps Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_WORKING_DIR: terraform/platform/finops
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: |
          terraform \
            -chdir="${TF_WORKING_DIR}" \
            fmt \
            -check \
            -recursive

      - name: Initialize Terraform without backend
        run: |
          terraform \
            -chdir="${TF_WORKING_DIR}" \
            init \
            -backend=false \
            -input=false

      - name: Validate Terraform configuration
        run: |
          terraform \
            -chdir="${TF_WORKING_DIR}" \
            validate \
            -no-color

  validate-release-workflow:
    name: Parse FinOps Release Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse workflow YAML
        shell: ruby {0}
        run: |
          require "yaml"

          workflows = [
            ".github/workflows/build-finops-budget-consumer-image.yml",
            ".github/workflows/finops-pr-validation.yml"
          ]

          workflows.each do |workflow|
            YAML.parse_file(workflow)
            puts "Parsed #{workflow}"
          end
