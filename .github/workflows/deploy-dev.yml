name: Deploy Dev Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/dev/**'
      - '.github/workflows/deploy-dev.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev-cloud-run:
    name: Deploy Dev Cloud Run
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: dev-cloud-run
      cancel-in-progress: false
    env:
      TF_WORKING_DIR: terraform/environments/dev/cloud-run
      TF_IN_AUTOMATION: true
      DEPLOY_SERVICE_ACCOUNT: paved-road-sa@imposing-fx-413205.iam.gserviceaccount.com
      RELEASE_METADATA_TYPE: https://paved-road-platform.dev/attestations/release-metadata/v1
      DEV_DEPLOYMENT_EVIDENCE_TYPE: https://paved-road-platform.dev/attestations/dev-deployment/v1
      COSIGN_REPOSITORY: >-
        us-central1-docker.pkg.dev/imposing-fx-413205/paved-road-trust/paved-road-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/915035381641/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: imposing-fx-413205

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            us-central1-docker.pkg.dev \
            --quiet

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=${TF_WORKING_DIR} init

      - name: Resolve configured immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          TFVARS_FILE="${TF_WORKING_DIR}/terraform.tfvars"

          IMAGE_ENTRY_COUNT="$(
            awk \
              '/^[[:space:]]*image[[:space:]]*=/{count++}
               END {print count + 0}' \
              "${TFVARS_FILE}"
          )"

          if [ "${IMAGE_ENTRY_COUNT}" -ne 1 ]; then
            echo "Expected exactly one image assignment in ${TFVARS_FILE}."
            exit 1
          fi

          IMAGE_DIGEST_URI="$(
            awk -F'"' \
              '/^[[:space:]]*image[[:space:]]*=/{print $2}' \
              "${TFVARS_FILE}"
          )"

          if [[ ! "${IMAGE_DIGEST_URI}" =~ ^us-central1-docker\.pkg\.dev/imposing-fx-413205/paved-road-containers/paved-road-platform@sha256:[a-f0-9]{64}$ ]]; then
            echo "Terraform must reference an immutable Paved Road image digest."
            exit 1
          fi

          IMAGE_DIGEST="${IMAGE_DIGEST_URI##*@}"

          APP_VERSION="$(
            awk -F'"' \
              '/^[[:space:]]*APP_VERSION[[:space:]]*=/{print $2}' \
              "${TFVARS_FILE}"
          )"

          COMMIT_SHA="$(
            awk -F'"' \
              '/^[[:space:]]*COMMIT_SHA[[:space:]]*=/{print $2}' \
              "${TFVARS_FILE}"
          )"

          if [[ ! "${APP_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Terraform APP_VERSION must be a semantic release tag."
            exit 1
          fi

          if [[ ! "${COMMIT_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Terraform COMMIT_SHA must be a full 40-character commit."
            exit 1
          fi

          {
            echo "digest_uri=${IMAGE_DIGEST_URI}"
            echo "digest=${IMAGE_DIGEST}"
            echo "release_tag=${APP_VERSION}"
            echo "commit_sha=${COMMIT_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signature, attestations, release metadata, and Cloud Build provenance
        shell: bash
        env:
          IMAGE_DIGEST_URI: ${{ steps.image.outputs.digest_uri }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_RELEASE_TAG: ${{ steps.image.outputs.release_tag }}
          EXPECTED_COMMIT_SHA: ${{ steps.image.outputs.commit_sha }}
          BUILD_SOURCE_PROJECT_ID: imposing-fx-413205
          TRUSTED_BUILD_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/build-paved-road-image.yml@refs/heads/main
        run: |
          set -euo pipefail

          COMMON_ARGS=(
            --certificate-identity "${TRUSTED_BUILD_IDENTITY}"
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          )

          timeout 5m cosign verify \
            "${IMAGE_DIGEST_URI}" \
            "${COMMON_ARGS[@]}" \
            >/dev/null

          timeout 5m cosign verify-attestation \
            "${IMAGE_DIGEST_URI}" \
            --type spdxjson \
            "${COMMON_ARGS[@]}" \
            >/dev/null

          PROVENANCE_FILE="${RUNNER_TEMP}/source-provenance.json"
          ATTESTATION_FILE="${RUNNER_TEMP}/verified-release-metadata.json"

          gcloud artifacts docker images describe \
            "${IMAGE_DIGEST_URI}" \
            --project="${BUILD_SOURCE_PROJECT_ID}" \
            --show-provenance \
            --format=json \
            > "${PROVENANCE_FILE}"

          timeout 5m cosign verify-attestation \
            "${IMAGE_DIGEST_URI}" \
            --type "${RELEASE_METADATA_TYPE}" \
            "${COMMON_ARGS[@]}" \
            > "${ATTESTATION_FILE}"

          PREDICATE="$(
            jq -er '
              .payload
              | @base64d
              | fromjson
              | .predicate
            ' "${ATTESTATION_FILE}"
          )"

          SOURCE_URI="$(jq -er '.cloud_build_source_uri' <<<"${PREDICATE}")"
          METADATA_REPOSITORY="$(jq -er '.repository' <<<"${PREDICATE}")"
          METADATA_REF="$(jq -er '.git_ref' <<<"${PREDICATE}")"
          METADATA_COMMIT="$(jq -er '.git_commit' <<<"${PREDICATE}")"
          METADATA_TAG="$(jq -er '.release_tag' <<<"${PREDICATE}")"
          METADATA_DIGEST="$(jq -er '.image_digest' <<<"${PREDICATE}")"

          [ "${METADATA_REPOSITORY}" = "${GITHUB_REPOSITORY}" ] || {
            echo "::error::Release metadata repository mismatch."
            exit 1
          }

          [ "${METADATA_REF}" = "refs/heads/main" ] || {
            echo "::error::Release metadata is not bound to main."
            exit 1
          }

          [ "${METADATA_COMMIT}" = "${EXPECTED_COMMIT_SHA}" ] || {
            echo "::error::Release metadata commit mismatch."
            exit 1
          }

          [ "${METADATA_TAG}" = "${EXPECTED_RELEASE_TAG}" ] || {
            echo "::error::Release metadata tag mismatch."
            exit 1
          }

          [ "${METADATA_DIGEST}" = "${EXPECTED_DIGEST}" ] || {
            echo "::error::Release metadata digest mismatch."
            exit 1
          }

          case "${SOURCE_URI}" in
            "gs://${BUILD_SOURCE_PROJECT_ID}_cloudbuild/source/"*) ;;
            *)
              echo "::error::Signed source URI is outside the trusted Cloud Build bucket."
              exit 1
              ;;
          esac

          EXPECTED_DIGEST_HEX="${EXPECTED_DIGEST#sha256:}"
          EXPECTED_BUILDER="https://cloudbuild.googleapis.com/GoogleHostedWorker"
          EXPECTED_BUILD_TYPE="https://cloud.google.com/build/gcb-buildtypes/google-worker/v1"
          EXPECTED_PREDICATE_TYPE="https://slsa.dev/provenance/v1"

          jq -e \
            --arg digest "${EXPECTED_DIGEST_HEX}" \
            --arg builder "${EXPECTED_BUILDER}" \
            --arg build_type "${EXPECTED_BUILD_TYPE}" \
            --arg predicate_type "${EXPECTED_PREDICATE_TYPE}" \
            --arg source_uri "${SOURCE_URI}" '
              [
                .provenance_summary.provenance[]?
                | .build.inTotoSlsaProvenanceV1?
                | select(. != null)
                | select(.predicateType == $predicate_type)
                | select(.predicate.runDetails.builder.id == $builder)
                | select(.predicate.buildDefinition.buildType == $build_type)
                | select(any(.subject[]?; .digest.sha256 == $digest))
                | select(
                    any(
                      .predicate.buildDefinition.resolvedDependencies[]?;
                      .uri == $source_uri
                      or (.uri | startswith($source_uri + "#"))
                    )
                  )
              ]
              | length > 0
            ' "${PROVENANCE_FILE}" >/dev/null || {
              echo "::error::Cloud Build provenance verification failed."
              exit 1
            }

          echo "Signature, SBOM, release metadata, and Cloud Build provenance verification passed."

      - name: Terraform apply
        run: terraform -chdir=${TF_WORKING_DIR} apply -input=false -auto-approve

      - name: Validate deployed Dev revision and immutable digest
        id: dev_deployment
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ steps.image.outputs.digest_uri }}
          PROJECT_ID: imposing-fx-413205
          REGION: us-central1
          SERVICE_NAME: backstage-acceptance-test
        run: |
          set -euo pipefail

          SERVICE_JSON="$(
            gcloud run services describe "${SERVICE_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --platform=managed \
              --format=json
          )"

          READY="$(
            jq -r '
              [.status.conditions[]? | select(.type == "Ready")][0].status
              // [.status.conditions[]? | select(.type == "Ready")][0].state
              // "UNKNOWN"
            ' <<< "${SERVICE_JSON}"
          )"

          LATEST_READY_REVISION="$(
            jq -r '.status.latestReadyRevisionName // empty' \
              <<< "${SERVICE_JSON}"
          )"

          LATEST_CREATED_REVISION="$(
            jq -r '.status.latestCreatedRevisionName // empty' \
              <<< "${SERVICE_JSON}"
          )"

          DEPLOYED_IMAGE="$(
            jq -r '.spec.template.spec.containers[0].image // empty' \
              <<< "${SERVICE_JSON}"
          )"

          SERVICE_URL="$(
            jq -r '.status.url // empty' \
              <<< "${SERVICE_JSON}"
          )"

          TRAFFIC_PERCENT="$(
            jq -r \
              --arg revision "${LATEST_READY_REVISION}" '
                [
                  .status.traffic[]?
                  | select(
                      .revisionName == $revision
                      or .latestRevision == true
                    )
                  | .percent
                ][0] // 0
              ' <<< "${SERVICE_JSON}"
          )"

          if [[ "${READY}" != "True" && "${READY}" != "CONDITION_SUCCEEDED" ]]; then
            echo "Dev Cloud Run service is not ready: ${READY}"
            exit 1
          fi

          if [[ -z "${LATEST_READY_REVISION}" ||
                "${LATEST_READY_REVISION}" != "${LATEST_CREATED_REVISION}" ]]; then
            echo "Latest created revision is not the latest ready revision."
            echo "Created: ${LATEST_CREATED_REVISION}"
            echo "Ready:   ${LATEST_READY_REVISION}"
            exit 1
          fi

          if [[ "${TRAFFIC_PERCENT}" != "100" ]]; then
            echo "Latest Dev revision does not receive 100% of traffic."
            echo "Observed traffic: ${TRAFFIC_PERCENT}%"
            exit 1
          fi

          if [[ "${DEPLOYED_IMAGE}" != "${EXPECTED_IMAGE}" ]]; then
            echo "Dev deployed image does not match the configured digest."
            echo "Expected: ${EXPECTED_IMAGE}"
            echo "Observed: ${DEPLOYED_IMAGE}"
            exit 1
          fi

          if [[ -z "${SERVICE_URL}" ]]; then
            echo "Cloud Run service URL was not returned."
            exit 1
          fi

          echo "revision=${LATEST_READY_REVISION}" >> "${GITHUB_OUTPUT}"
          echo "service_url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Run authenticated Dev health check
        shell: bash
        env:
          SERVICE_URL: ${{ steps.dev_deployment.outputs.service_url }}
        run: |
          set -euo pipefail

          ID_TOKEN="$(
            gcloud auth print-identity-token \
              --impersonate-service-account="${DEPLOY_SERVICE_ACCOUNT}" \
              --audiences="${SERVICE_URL}"
          )"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output health-response.txt \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --header "Authorization: Bearer ${ID_TOKEN}" \
              "${SERVICE_URL}/health"
          )"

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "Dev health check failed with HTTP ${HTTP_STATUS}."
            sed -n '1,40p' health-response.txt
            exit 1
          fi

          echo "Authenticated Dev health check passed."

      - name: Attest verified Dev deployment evidence
        shell: bash
        env:
          IMAGE_DIGEST_URI: ${{ steps.image.outputs.digest_uri }}
          DEV_REVISION: ${{ steps.dev_deployment.outputs.revision }}
          SERVICE_URL: ${{ steps.dev_deployment.outputs.service_url }}
        run: |
          set -euo pipefail

          IMAGE_DIGEST="${IMAGE_DIGEST_URI##*@}"

          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_ref "${GITHUB_WORKFLOW_REF}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg git_commit "${GITHUB_SHA}" \
            --arg image_digest "${IMAGE_DIGEST}" \
            --arg project_id "imposing-fx-413205" \
            --arg region "us-central1" \
            --arg service_name "backstage-acceptance-test" \
            --arg revision "${DEV_REVISION}" \
            --arg service_url "${SERVICE_URL}" \
            '{
              repository: $repository,
              workflow_ref: $workflow_ref,
              workflow_run_id: $workflow_run_id,
              git_commit: $git_commit,
              image_digest: $image_digest,
              environment: "dev",
              project_id: $project_id,
              region: $region,
              service_name: $service_name,
              revision: $revision,
              traffic_percent: 100,
              health_endpoint: ($service_url + "/health"),
              health_status: 200
            }' > dev-deployment-evidence.json

          cosign attest \
            --yes \
            --predicate dev-deployment-evidence.json \
            --type "${DEV_DEPLOYMENT_EVIDENCE_TYPE}" \
            "${IMAGE_DIGEST_URI}"

      - name: Notify Slack (Dev Deploy Success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\": \"🚀 *Dev Deployment Successful*\nService: Cloud Run\nEnvironment: dev\nCommit: \`${{ github.sha }}\`\nTriggered by: ${{ github.actor }}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (Dev Deploy Failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\": \"🔥 *Dev Deployment Failed*\nEnvironment: dev\nCommit: \`${{ github.sha }}\`\nActor: ${{ github.actor }}\nCheck logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}